# Run without installing PostgreSQL: an in-memory H2 database in PostgreSQL mode.
# Data is lost when the backend stops. Combine with "demo" to get sample data:
#   mvn spring-boot:run "-Dspring-boot.run.profiles=local,demo"
spring:
  datasource:
    url: jdbc:h2:mem:jobtracker;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
  h2:
    console:
      enabled: true
      path: /h2-console
